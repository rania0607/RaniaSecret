<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin — Morocco Secrets{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --darkred: #8B0000;
            --darkred-deep: #6b0000;
            --gold: #C9A84C;
            --gold-light: rgba(201,168,76,0.15);
            --beige: #F7F3EE;
            --beige-dark: #EDE6DB;
            --white: #FFFFFF;
            --text: #1a1410;
            --muted: #7c6e62;
            --border: rgba(139,0,0,0.10);
            --border-light: rgba(0,0,0,0.07);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--beige);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background: linear-gradient(180deg, #6b0000 0%, #8B0000 60%, #7a0000 100%);
            color: var(--white);
            display: flex;
            flex-direction: column;
            padding: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
        }
        .sidebar-brand {
            padding: 22px 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.10);
        }
        .sidebar-logo {
            height: 46px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }
        .sidebar-brand span {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            color: var(--gold);
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            flex: 1;
        }
        .sidebar-nav a {
            color: rgba(255,255,255,0.78);
            text-decoration: none;
            padding: 11px 24px;
            font-size: 0.875rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.08);
            color: var(--white);
            border-left-color: rgba(201,168,76,0.5);
        }
        .sidebar-nav a.active {
            background: rgba(201,168,76,0.18);
            border-left-color: var(--gold);
            color: var(--gold);
            font-weight: 600;
        }
        .sidebar-section {
            padding: 16px 24px 6px;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: rgba(255,255,255,0.35);
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.10);
        }
        .sidebar-footer a {
            color: rgba(255,255,255,0.60);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.15s;
        }
        .sidebar-footer a:hover { color: var(--gold); }

        /* ── MAIN ── */
        .main {
            padding: 32px 40px;
            min-width: 0;
            background: var(--beige);
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            margin-bottom: 28px;
            border-bottom: 2px solid var(--gold);
        }
        .page-header h1 {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--darkred);
            letter-spacing: -0.3px;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 720px) {
            .admin-layout { grid-template-columns: 1fr; }
            .sidebar {
                position: relative;
                height: auto;
                flex-direction: row;
                padding: 12px;
                align-items: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            }
            .sidebar-brand { border: none; padding: 0 16px 0 0; flex-direction: row; align-items: center; gap: 10px; }
            .sidebar-brand span { font-size: 0.88rem; }
            .sidebar-logo { height: 36px; }
            .sidebar-nav { flex-direction: row; padding: 0; flex: 1; overflow-x: auto; }
            .sidebar-nav a { padding: 8px 12px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
            .sidebar-nav a:hover { border-left-color: transparent; border-bottom-color: rgba(201,168,76,0.5); }
            .sidebar-nav a.active { border-left: none; border-bottom-color: var(--gold); }
            .sidebar-section { display: none; }
            .sidebar-footer { border: none; padding: 0 12px; }
            .main { padding: 20px 16px; }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand" style="flex-direction: column; align-items: flex-start; padding: 20px 24px;">
                <img src="{{ logo_url }}" alt="Logo" class="sidebar-logo">
                <span>Morocco Secrets</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('admin.dashboard') }}"
                   class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('admin.villes_list') }}"
                   class="{% if active_nav == 'villes' %}active{% endif %}">Cities</a>
                <a href="{{ url_for('admin.users_list') }}"
                   class="{% if active_nav == 'users' %}active{% endif %}">Users</a>
                <div class="sidebar-section">Paramètres</div>
                <a href="{{ url_for('admin.media_settings') }}"
                   class="{% if active_nav == 'media' %}active{% endif %}">Média</a>
            </nav>
            <div class="sidebar-footer">
                <a href="{{ url_for('admin.logout') }}">Logout</a>
            </div>
        </aside>
        <main class="main">
            <div class="page-header">
                <h1>{% block heading %}{% endblock %}</h1>
                {% block header_actions %}{% endblock %}
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
